<!doctype html>
<html><head><meta charset="utf-8"><script src="/test-forms/load.js"></script>
<style>body{font-family:sans-serif} .q{margin-top:8px} input,select{width:95%;padding:5px}</style></head><body>
<form onsubmit="event.preventDefault()">
  <div class="q">Name <input name="candidate_name"></div>
  <div class="q"><input name="mail" placeholder="Email address"></div>
  <div class="q"><input name="contact" placeholder="Contact number"></div>
  <div class="q">Highest qualification <select name="qual"><option>Choose</option><option>Diploma</option><option>B.Tech / B.E.</option><option>M.Tech</option><option>MCA</option></select></div>
  <div class="q">College <input name="inst"></div>
  <div class="q">Year of passing <input name="yop"></div>
  <div class="q">Gender <select name="g"><option>Select</option><option>Male</option><option>Female</option><option>Prefer not to say</option></select></div>
  <div class="q">Are you legally authorized to work in India? <label><input type="radio" name="auth" value="y">Yes</label><label><input type="radio" name="auth" value="n">No</label></div>
  <div class="q">Upload CV <input type="file" name="cv"></div>
  <div class="q">Password <input type="password" name="pw"></div>
  <button>Submit</button>
</form></body></html>
